name: Tests and dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . -c requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
