[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscape"
version = "0.1.0"
description = "A small terminal workspace for teams of Ollama agents"
requires-python = ">=3.11"
dependencies = ["rich>=15.0.0,<16", "prompt-toolkit>=3.0,<4", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.scripts]
agentscape = "agentscape.cli:main"

[tool.setuptools.packages.find]
include = ["agentscape*"]
